<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Chart icon background -->
  <rect width="100" height="100" rx="15" fill="url(#grad)"/>
  <!-- Line chart -->
  <polyline points="15,70 30,50 45,60 60,35 75,45 90,25" 
            fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points -->
  <circle cx="15" cy="70" r="3" fill="white"/>
  <circle cx="30" cy="50" r="3" fill="white"/>
  <circle cx="45" cy="60" r="3" fill="white"/>
  <circle cx="60" cy="35" r="3" fill="white"/>
  <circle cx="75" cy="45" r="3" fill="white"/>
  <circle cx="90" cy="25" r="3" fill="white"/>
  <!-- Axes -->
  <line x1="10" y1="85" x2="95" y2="85" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="10" y1="15" x2="10" y2="85" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
